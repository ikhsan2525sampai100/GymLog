<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Gym Tracker & Lifestyle SuperApp</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--cy:#38bdf8;--em:#10b981;--cr:#ef4444;--tx:#e2e8f0;--mu:#94a3b8;--ln:#334155}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh}
.hide{display:none!important}
h2{font-size:1.05rem;margin-bottom:10px}
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#auth-screen .btn{max-width:320px}
#app-screen{max-width:480px;margin:auto;padding:16px 14px calc(84px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:11px;font-size:16px;margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:block;text-align:center;background:var(--cy);color:#0f172a;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:1rem;width:100%;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.em{background:var(--em)}
.btn.cr{background:var(--cr);color:#fff}
.del{background:none;border:1px solid var(--cr);color:var(--cr);border-radius:8px;padding:4px 8px;font-size:.78rem;cursor:pointer;white-space:nowrap}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--mu);font-weight:600}
.seg button.on{background:var(--cy);color:#0f172a;border-color:var(--cy)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln)}
.mu,.item small{color:var(--mu)}
.badge{display:inline-block;background:var(--bg);border:1px solid var(--cy);color:var(--cy);border-radius:99px;padding:3px 10px;font-size:.78rem;margin:2px 3px 2px 0}
.pr{border-color:var(--em);color:var(--em)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 2px;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.3rem}
nav i{font-style:normal}
nav button.on{color:var(--cy)}
canvas{width:100%;height:170px;display:block}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--em);transition:width 2s linear}
#av{width:72px;height:72px;border-radius:50%;border:2px solid var(--cy);object-fit:cover}
.tot{font-size:1.4rem;color:var(--em);font-weight:700}
</style>
</head>
<body>

<div id="auth-screen">
  <div style="font-size:64px">🏋️</div>
  <h1>Gym Tracker &amp; Lifestyle</h1>
  <p class="mu" data-i="tag"></p>
  <button id="btn-google" class="btn" data-i="login"></button>
</div>

<div id="app-screen" class="hide">

  <section id="p0">
    <div class="seg" id="seg"></div>
    <form id="f-log" class="card">
      <h2 data-i="logT"></h2>
      <input id="ex" list="exl" required autocomplete="off" data-ph="exPh">
      <datalist id="exl"></datalist>
      <div class="row">
        <input id="st" type="number" min="1" value="3" inputmode="numeric" data-ph="sets">
        <input id="kg" type="number" min="0" step="0.5" required inputmode="decimal" data-ph="kg">
        <input id="rp" type="number" min="1" required inputmode="numeric" data-ph="reps">
      </div>
      <p class="mu" id="e1p" style="margin-bottom:8px"></p>
      <button class="btn" data-i="save"></button>
    </form>
    <div class="card"><h2 id="lt"></h2><div id="loglist"></div></div>
  </section>

  <section id="p1" class="hide">
    <div class="card">
      <h2 data-i="pT"></h2>
      <select id="pex"></select>
      <canvas id="cv"></canvas>
      <p id="lgd" style="margin-top:6px;font-size:.85rem"></p>
    </div>
    <div class="card"><h2 data-i="prT"></h2><div id="prl"></div></div>
  </section>

  <section id="p2" class="hide">
    <div class="card">
      <h2 data-i="cam"></h2>
      <label class="btn">📷 <span data-i="snap"></span>
        <input id="cam" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <img id="pv" class="hide" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:10px">
      <div id="scan" class="hide"><div class="bar"><i id="sb"></i></div><p id="sm" class="mu"></p></div>
      <div id="res"></div>
    </div>
    <div class="card">
      <h2 data-i="expT"></h2>
      <form id="f-exp">
        <select id="cat">
          <option value="0" data-i="c0"></option><option value="1" data-i="c1"></option>
          <option value="2" data-i="c2"></option><option value="3" data-i="c3"></option>
        </select>
        <input id="amt" type="number" min="1" required inputmode="numeric" data-ph="amt">
        <button class="btn em" data-i="add"></button>
      </form>
      <p style="margin-top:12px"><span class="mu" data-i="total"></span> <span class="tot" id="tot"></span></p>
      <div id="explist"></div>
    </div>
  </section>

  <section id="p3" class="hide">
    <div class="card" style="text-align:center">
      <img id="av" alt="" referrerpolicy="no-referrer">
      <h2 id="uname" style="margin-top:8px"></h2>
      <p class="mu" id="pcity"></p>
      <div id="badges"></div>
    </div>
    <form id="f-prof" class="card">
      <h2 data-i="setT"></h2>
      <input id="pg" data-ph="gym">
      <select id="pm"><option value="0" data-i="m0"></option><option value="1" data-i="m1"></option><option value="2" data-i="m2"></option></select>
      <input id="pc" data-ph="coach">
      <input id="pl" data-ph="city">
      <button class="btn" data-i="saveP"></button>
    </form>
    <div class="card"><h2 data-i="langT"></h2><button class="btn" type="button" id="lang-btn"></button></div>
    <div class="card">
      <h2>🔒 <span data-i="secT"></span></h2>
      <p class="mu" data-i="secTx" style="margin-bottom:8px"></p>
      <span class="badge pr" data-i="secOk"></span>
    </div>
    <button class="btn cr" id="out" data-i="out"></button>
  </section>

  <nav>
    <button data-p="0" class="on"><span>🏋️</span><i data-i="t0"></i></button>
    <button data-p="1"><span>📈</span><i data-i="t1"></i></button>
    <button data-p="2"><span>💸</span><i data-i="t2"></i></button>
    <button data-p="3"><span>👤</span><i data-i="t3"></i></button>
  </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, addDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLMCVBYvz28W5v7zSoqByjsNOVPbDbeiE",
  authDomain: "gymlog-47050.firebaseapp.com",
  projectId: "gymlog-47050",
  storageBucket: "gymlog-47050.firebasestorage.app",
  messagingSenderId: "22448198182",
  appId: "1:22448198182:web:82a1698d24e9f6c056cce7",
  measurementId: "G-PSR9KY9MNF"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);

/* ===== Bahasa ID / EN ===== */
const T = {
id:{tag:'Catat latihan, progres, dan gaya hidup sehat',login:'Masuk dengan Google',connecting:'Menghubungkan Google...',
t0:'Latihan',t1:'Progres',t2:'Gaya Hidup',t3:'Profil',ses:'Sesi',logT:'Catat Latihan',exPh:'Nama latihan (mis. Leg Press)',
sets:'Set',kg:'Berat (kg)',reps:'Reps',save:'Simpan Latihan',e1:'Est. 1RM',hist:'Riwayat',empty:'Belum ada data.',
del:'🗑 Hapus Data',sure:'Hapus data ini?',pr:'🏆 PR',pT:'Grafik Progres',lg1:'1RM maks',lg2:'Volume maks',prT:'Riwayat PR',noPR:'Belum ada PR.',
cam:'Kamera AI Kalori Makanan',snap:'Foto Makanan',scan:'Memindai makanan dengan AI...',sim:'Simulasi demo, bukan hasil AI sungguhan.',
expT:'Pengeluaran Gym',c0:'Bulanan Gym',c1:'Harian Gym',c2:'Bayar Coach',c3:'Makanan / Suplemen',amt:'Jumlah (Rp)',add:'Tambah Pengeluaran',total:'Total:',
setT:'Atur Profil Gym',gym:'Nama tempat gym',m0:'Harian',m1:'Bulanan',m2:'Tahunan',coach:'Nama coach',city:'Kota / lokasi',saveP:'Simpan Profil',saved:'Profil tersimpan ✅',
langT:'Bahasa',secT:'Keamanan Data',secTx:'Data dikirim lewat HTTPS (TLS) dan dienkripsi saat disimpan di Firebase.',secOk:'✅ Terenkripsi & tersimpan aman',out:'Keluar'},
en:{tag:'Track workouts, progress, and a healthy lifestyle',login:'Sign in with Google',connecting:'Connecting to Google...',
t0:'Workout',t1:'Progress',t2:'Lifestyle',t3:'Profile',ses:'Session',logT:'Log Workout',exPh:'Exercise name (e.g. Leg Press)',
sets:'Sets',kg:'Weight (kg)',reps:'Reps',save:'Save Workout',e1:'Est. 1RM',hist:'History',empty:'No data yet.',
del:'🗑 Delete',sure:'Delete this entry?',pr:'🏆 PR',pT:'Progress Chart',lg1:'Max 1RM',lg2:'Max volume',prT:'PR History',noPR:'No PRs yet.',
cam:'AI Food Calorie Camera',snap:'Photo of Food',scan:'Scanning food with AI...',sim:'Demo simulation, not a real AI result.',
expT:'Gym Expenses',c0:'Gym Monthly',c1:'Gym Daily',c2:'Pay Coach',c3:'Food / Supplements',amt:'Amount (Rp)',add:'Add Expense',total:'Total:',
setT:'Gym Profile Settings',gym:'Gym name',m0:'Daily',m1:'Monthly',m2:'Yearly',coach:'Coach name',city:'City / location',saveP:'Save Profile',saved:'Profile saved ✅',
langT:'Language',secT:'Data Security',secTx:'Data travels over HTTPS (TLS) and is encrypted at rest in Firebase.',secOk:'✅ Encrypted & stored securely',out:'Sign out'}
};
const DEF = ['Leg Press','Lat Pulldown','Chest Press','Seated Row','Shoulder Press','Lateral Raise'];
const FOODS = [['Nasi goreng',560],['Ayam geprek + nasi',690],['Mie goreng',480],['Soto ayam',320],['Telur dadar + nasi',430],['Gado-gado',350]];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const rp = n => 'Rp ' + n.toLocaleString('id-ID');
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const er = e => { console.error(e); if (!er.s) { er.s = 1; alert('Firestore: ' + (e.code || e.message)); } };
let U = null, logs = [], exps = [], prof = {}, ses = 1, unsub = [], lang = localStorage.lang || 'id';
const t = k => T[lang][k] || k;
const col = n => collection(db, 'users', U.uid, n);

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = t(e.dataset.ph));
  $('lang-btn').textContent = lang == 'id' ? '🇮🇩 Bahasa Indonesia' : '🇬🇧 English';
  upd1(); renderLogs(); renderExp(); renderProf();
}
const upd1 = () => { const w = +$('kg').value, r = +$('rp').value; $('e1p').textContent = w && r ? `${t('e1')}: ${(w * (1 + r / 30)).toFixed(1)} kg` : ''; };

/* ===== Latihan ===== */
function renderLogs() {
  $('seg').innerHTML = [1, 2, 3].map(n => `<button data-s="${n}" class="${n == ses ? 'on' : ''}">${t('ses')} ${n}</button>`).join('');
  $('lt').textContent = `${t('hist')} · ${t('ses')} ${ses}`;
  const L = logs.filter(l => l.ses == ses).slice(0, 40);
  $('loglist').innerHTML = L.length ? L.map(l => `<div class="item"><div><b>${esc(l.n)}</b> ${l.pr ? `<span class="badge pr">${t('pr')}</span>` : ''}<br><small>${l.s}×${l.r} @ ${l.w} kg · ${t('e1')} ${l.e1} kg · ${l.d}</small></div><button class="del" data-id="${l.id}">${t('del')}</button></div>`).join('') : `<p class="mu">${t('empty')}</p>`;
  $('exl').innerHTML = [...new Set([...DEF, ...logs.map(l => l.n)])].map(n => `<option value="${esc(n)}">`).join('');
  const s = $('pex'), v = s.value, names = [...new Set(logs.map(l => l.n))];
  s.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  if (names.includes(v)) s.value = v;
  chart(); prList();
}

/* ===== Progres ===== */
function chart() {
  const c = $('cv'), k = c.getContext('2d'), W = c.width = (c.clientWidth * 2) || 700, H = c.height = 340;
  k.clearRect(0, 0, W, H);
  k.strokeStyle = '#334155'; k.lineWidth = 2;
  for (let i = 0; i <= 3; i++) { const y = 30 + i * (H - 80) / 3; k.beginPath(); k.moveTo(10, y); k.lineTo(W - 10, y); k.stroke(); }
  const days = {};
  logs.filter(l => l.n === $('pex').value).sort((a, b) => a.ts - b.ts).forEach(l => {
    const d = days[l.d] || (days[l.d] = { e: 0, v: 0 }); d.e = Math.max(d.e, l.e1); d.v += l.vol;
  });
  const D = Object.entries(days); $('lgd').innerHTML = '';
  k.font = '22px sans-serif'; k.fillStyle = '#94a3b8';
  if (!D.length) { k.fillText(t('empty'), 20, H / 2); return; }
  let lg = '';
  [['e', '#38bdf8', 'lg1'], ['v', '#10b981', 'lg2']].forEach(([f, col]) => {
    const m = Math.max(...D.map(x => x[1][f])) || 1;
    const pos = (i, v) => [D.length > 1 ? 30 + i * (W - 60) / (D.length - 1) : W / 2, 30 + (H - 80) * (1 - v / m)];
    k.strokeStyle = col; k.fillStyle = col; k.lineWidth = 4; k.beginPath();
    D.forEach(([, v], i) => { const [x, y] = pos(i, v[f]); i ? k.lineTo(x, y) : k.moveTo(x, y); });
    k.stroke();
    D.forEach(([, v], i) => { const [x, y] = pos(i, v[f]); k.beginPath(); k.arc(x, y, 6, 0, 7); k.fill(); });
    lg += `<span style="color:${col};margin-right:12px">● ${t(f == 'e' ? 'lg1' : 'lg2')}: ${m.toLocaleString('id-ID')}</span>`;
  });
  $('lgd').innerHTML = lg;
  k.fillStyle = '#94a3b8'; k.fillText(D[0][0].slice(5), 10, H - 12);
  const e = D[D.length - 1][0].slice(5); k.fillText(e, W - k.measureText(e).width - 10, H - 12);
}
function prList() {
  const P = logs.filter(l => l.pr);
  $('prl').innerHTML = P.length ? P.map(l => `<div class="item"><div><b>${esc(l.n)}</b><br><small>${l.d} · ${l.w} kg × ${l.r}</small></div><span class="badge pr">🏆 ${l.e1} kg</span></div>`).join('') : `<p class="mu">${t('noPR')}</p>`;
}

/* ===== Pengeluaran ===== */
function renderExp() {
  $('tot').textContent = rp(exps.reduce((a, x) => a + x.a, 0));
  $('explist').innerHTML = exps.length ? exps.map(x => `<div class="item"><div><b>${t('c' + x.c)}</b><br><small>${x.d}</small></div><div style="text-align:right"><b>${rp(x.a)}</b><br><button class="del" data-id="${x.id}">${t('del')}</button></div></div>`).join('') : `<p class="mu">${t('empty')}</p>`;
}

/* ===== Profil ===== */
function renderProf() {
  $('pcity').textContent = prof.city ? '📍 ' + prof.city : '';
  $('badges').innerHTML = (prof.gym ? `<span class="badge">🏢 ${esc(prof.gym)} · ${t('m' + (prof.mem || 0))}</span>` : '') + (prof.coach ? `<span class="badge">🧑‍🏫 ${esc(prof.coach)}</span>` : '');
}

/* ===== Auth ===== */
onAuthStateChanged(auth, u => {
  U = u; unsub.forEach(f => f()); unsub = [];
  $('auth-screen').classList.toggle('hide', !!u);
  $('app-screen').classList.toggle('hide', !u);
  if (!u) { logs = []; exps = []; prof = {}; applyLang(); return; }
  $('av').src = u.photoURL || ''; $('av').classList.toggle('hide', !u.photoURL);
  $('uname').textContent = u.displayName || u.email;
  unsub.push(
    onSnapshot(query(col('logs'), orderBy('ts', 'desc')), s => { logs = s.docs.map(d => ({ id: d.id, ...d.data() })); renderLogs(); }, er),
    onSnapshot(query(col('expenses'), orderBy('ts', 'desc')), s => { exps = s.docs.map(d => ({ id: d.id, ...d.data() })); renderExp(); }, er),
    onSnapshot(doc(db, 'users', u.uid), s => {
      prof = s.data() || {}; renderProf();
      $('pg').value = prof.gym || ''; $('pm').value = prof.mem || 0; $('pc').value = prof.coach || ''; $('pl').value = prof.city || '';
    }, er)
  );
});

/* ===== Pasang event setelah DOM siap ===== */
document.addEventListener('DOMContentLoaded', () => {
  applyLang();

  const b = $('btn-google');
  b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = t('connecting');
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { alert('Login error: ' + (e.code || e.message)); }
    b.disabled = false; b.textContent = t('login');
  });
  $('out').addEventListener('click', () => signOut(auth));

  document.querySelector('nav').addEventListener('click', e => {
    const n = e.target.closest('button'); if (!n) return;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x == n));
    [0, 1, 2, 3].forEach(i => $('p' + i).classList.toggle('hide', i != n.dataset.p));
    if (n.dataset.p == 1) chart();
  });

  $('seg').addEventListener('click', e => { const s = e.target.closest('button'); if (s) { ses = +s.dataset.s; renderLogs(); } });
  $('kg').addEventListener('input', upd1); $('rp').addEventListener('input', upd1);
  $('pex').addEventListener('change', chart);

  $('f-log').addEventListener('submit', async e => {
    e.preventDefault();
    const n = $('ex').value.trim(), w = +$('kg').value, r = +$('rp').value, s = +$('st').value || 1, k = n.toLowerCase();
    if (!n || !w || !r) return;
    const e1 = +(w * (1 + r / 30)).toFixed(1);
    const prev = Math.max(0, ...logs.filter(l => l.k === k).map(l => l.e1));
    try {
      await addDoc(col('logs'), { n, k, w, r, s, ses, e1, vol: w * r * s, pr: prev > 0 && e1 > prev, d: today(), ts: Date.now() });
      $('kg').value = ''; $('rp').value = ''; upd1();
    } catch (x) { alert(x.code || x.message); }
  });
  $('loglist').addEventListener('click', e => {
    const d = e.target.closest('.del');
    if (d && confirm(t('sure'))) deleteDoc(doc(col('logs'), d.dataset.id)).catch(er);
  });

  $('f-exp').addEventListener('submit', async e => {
    e.preventDefault();
    const a = +$('amt').value; if (!a) return;
    try { await addDoc(col('expenses'), { c: +$('cat').value, a, d: today(), ts: Date.now() }); $('amt').value = ''; }
    catch (x) { alert(x.code || x.message); }
  });
  $('explist').addEventListener('click', e => {
    const d = e.target.closest('.del');
    if (d && confirm(t('sure'))) deleteDoc(doc(col('expenses'), d.dataset.id)).catch(er);
  });

  $('cam').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    $('pv').src = URL.createObjectURL(f); $('pv').classList.remove('hide');
    $('res').innerHTML = ''; $('scan').classList.remove('hide'); $('sm').textContent = t('scan');
    const bar = $('sb'); bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth;
    bar.style.transition = ''; bar.style.width = '100%';
    setTimeout(() => {
      $('scan').classList.add('hide');
      const [n, kc] = FOODS[Math.random() * FOODS.length | 0], c = Math.round(kc * (.85 + Math.random() * .3));
      $('res').innerHTML = `<div class="item"><div><b>${n}</b><br><small>${t('sim')}</small></div><span class="badge pr">${c} kcal</span></div>`;
    }, 2000);
    e.target.value = '';
  });

  $('f-prof').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await setDoc(doc(db, 'users', U.uid), { gym: $('pg').value.trim(), mem: +$('pm').value, coach: $('pc').value.trim(), city: $('pl').value.trim() }, { merge: true });
      alert(t('saved'));
    } catch (x) { alert(x.code || x.message); }
  });
  $('lang-btn').addEventListener('click', () => { lang = lang == 'id' ? 'en' : 'id'; localStorage.lang = lang; applyLang(); });
});
</script>
</body>
</html>
